<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARCALL — Tu recepcionista IA para México</title>
    <meta name="description" content="MARCALL es la plataforma de recepcionista virtual con IA para negocios mexicanos. Atiende llamadas 24/7 en español, agenda citas, califica leads y se integra con tu calendario." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3F6B57" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MARCALL" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,700&display=swap" />
  </head>
  <body>
    <style>
      .marcall-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAF7;color:#0A0A0A;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.18em;font-weight:600;font-size:.78rem}
      @media (prefers-color-scheme: dark){.marcall-boot{background:#0A0A0A;color:#FAFAF7}}
      .marcall-boot__logo{font-family:"Cabinet Grotesk","General Sans",system-ui,sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:.32em;margin-bottom:1rem}
      .marcall-boot__bar{width:40px;height:2px;background:currentColor;opacity:.18;border-radius:2px;overflow:hidden;position:relative}
      .marcall-boot__bar::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;animation:marcallBoot 1.1s ease-in-out infinite}
      @keyframes marcallBoot{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
    </style>
    <div id="root">
      <div class="marcall-boot" aria-label="Loading MARCALL">
        <div class="marcall-boot__logo">MARCALL</div>
        <div class="marcall-boot__bar" role="status" aria-live="polite"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
