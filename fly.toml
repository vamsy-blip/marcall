# MARCALL — Fly.io app config.
# Region: mia (Miami) — closest free region with low latency to Mexico.
# Single VM with a 1GB volume for data.db. Auto-stop when idle to stay free.

app = "marcall"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  MARCALL_MODE = "mock"
  PORT = "8080"
  SQLITE_PATH = "/data/data.db"

[[mounts]]
  source = "marcall_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
